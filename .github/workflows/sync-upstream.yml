name: sync-upstream

# Lives in the public repo so the mirror stays byte-identical to it; the gate
# below means it only ever runs in the mirror.
#
# SYNC_AUTO (repository variable in the mirror):
#   true  — upstream pushes and the cron reconciler sync on their own
#   false — only a human clicking Run workflow syncs; automatic triggers report
on:
  repository_dispatch:
    types: [upstream-push]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'AnoshanJ/echo-core-mirror'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # PAT, not GITHUB_TOKEN: GITHUB_TOKEN cannot push .github/workflows/**
          # at all, and its pushes trigger no workflows, so notify-app would
          # never fire and the chain would stop here with every job green.
          token: ${{ secrets.POC_PAT }}

      - name: Fast-forward main from upstream
        env:
          SYNC_AUTO: ${{ vars.SYNC_AUTO }}
          CLICKED: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/AnoshanJ/echo-core.git
          git fetch --no-tags upstream main

          mine=$(git rev-parse HEAD)
          theirs=$(git rev-parse upstream/main)
          base=$(git merge-base HEAD upstream/main)

          if [ "$mine" = "$theirs" ]; then
            echo "already in sync at ${mine:0:12}"
            exit 0
          fi
          if [ "$base" = "$theirs" ]; then
            echo "mirror is ahead of upstream — an undisclosed fix is in flight, nothing to sync"
            exit 0
          fi
          if [ "$base" != "$mine" ]; then
            echo "::error::mirror has diverged from upstream (base=${base:0:12} mine=${mine:0:12} theirs=${theirs:0:12}); a human must reconcile"
            exit 1
          fi

          if [ "${SYNC_AUTO:-true}" != "true" ] && [ "$CLICKED" != "true" ]; then
            echo "${theirs:0:12} is ready to sync; SYNC_AUTO is false, so run this workflow to apply it" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git merge --ff-only upstream/main
          git push origin main
          echo "fast-forwarded ${mine:0:12} -> ${theirs:0:12}"
